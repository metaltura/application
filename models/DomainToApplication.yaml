  - name: http
    instanceOf: Core:Package
    elements:
      - name: DomainToApi
        instanceOf: Core:Class
        icon: mui:Api
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Model
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Application:http.Api
            code: |
              import { Api } from 'Application/http'
              import { entityToResource } from 'DomainToApplication/http'

              /**
               * DomainToApi — the REST API of a domain model (rule 19): `api` on `/api`,
               * with one resource per entity of the model (EntityToResource).
               */
              export default function (source) {
                return new Api({
                  name: 'api',
                  basePath: '/api',
                  resources: this.entitiesOf(source).map((entity: any) => map(entity, entityToResource))
                })
              }
      - name: EntityToResource
        instanceOf: Core:Class
        icon: mui:Dns
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Application:http.Resource
            code: |
              import {
                Endpoint,
                Field,
                Parameter,
                Payload,
                Resource
              } from 'Application/http'
              import { fieldToPayloadField } from 'DomainToApplication/http'

              /**
               * EntityToResource — the REST resource of an entity (rules 20 to 22).
               *
               * The resource is named after the entity, on `/<entity>s`, and carries:
               * - the full payload `<Entity>`: `id`, every field of the entity and of its
               *   ancestors, the reference field of each relation (`clientId`) and `state`
               *   when the entity has a lifecycle;
               * - the input payload `<Entity>Input`: the same without `id`;
               * - the five CRUD endpoints: list, get, create, update and delete.
               *
               * Left to the stack pattern, which knows every entity: the `<parent>Id` of a
               * composition child and the audit fields.
               */
              export default function (source) {
                const text = e('Core:String')

                // What the pattern adds to the domain fields, decided once so that a name
                // clash with a domain field is reported once.
                const withId = this.canProduce(source, 'id')
                const references = this.referenceRelationsOf(source).filter((relation: any) =>
                  this.canProduce(source, this.referenceFieldName(relation))
                )
                const withState = !!source.lifecycle && this.canProduce(source, 'state')

                /** The fields both payloads carry, as new specs: a spec has a single parent. */
                const sharedFields = () => [
                  ...this.fieldsOf(source).map((field: any) => map(field, fieldToPayloadField)),
                  ...references.map(
                    (relation: any) =>
                      new Field({
                        name: this.referenceFieldName(relation),
                        type: text,
                        ...flagsOf({ mandatory: !relation.multiple && relation.mandatory, multiple: relation.multiple })
                      })
                  ),
                  ...(withState ? [new Field({ name: 'state', type: text, mandatory: true })] : [])
                ]

                const full = new Payload({
                  name: source.name,
                  fields: [...(withId ? [new Field({ name: 'id', type: text, mandatory: true })] : []), ...sharedFields()]
                })
                const input = new Payload({ name: `${source.name}Input`, fields: sharedFields() })
                return new Resource({
                  name: source.name,
                  path: this.resourcePathOf(source),
                  payloads: [full, input],
                  endpoints: crudEndpoints(full, input, text)
                })
              }

              /**
               * The five CRUD endpoints of a resource (rule 22). The three that address one
               * record take its `id` as a path parameter.
               */
              function crudEndpoints(full: any, input: any, text: any) {
                const id = () => [new Parameter({ name: 'id', type: text, mandatory: true, location: 'path' })]
                return [
                  new Endpoint({ name: 'list', method: 'GET', returnsList: true, response: full }),
                  new Endpoint({ name: 'get', method: 'GET', path: '/{id}', parameters: id(), response: full }),
                  new Endpoint({ name: 'create', method: 'POST', request: input, response: full }),
                  new Endpoint({ name: 'update', method: 'PUT', path: '/{id}', parameters: id(), request: input, response: full }),
                  new Endpoint({ name: 'delete', method: 'DELETE', path: '/{id}', parameters: id() })
                ]
              }

              type Flags = { mandatory?: boolean; multiple?: boolean }

              /**
               * `mandatory` and `multiple` only when they are set: a false flag
               * stays out of the spec.
               */
              function flagsOf(flags: Flags) {
                return {
                  ...(flags.mandatory ? { mandatory: true } : {}),
                  ...(flags.multiple ? { multiple: true } : {})
                }
              }
      - name: FieldToPayloadField
        instanceOf: Core:Class
        icon: mui:ShortText
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Field
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Application:http.Field
            code: |
              import { Field } from 'Application/http'

              /**
               * FieldToPayloadField — the payload field of a domain field (rule 21): the
               * same name, type and flags.
               */
              export default function (source) {
                return new Field({
                  name: source.name,
                  type: source.type,
                  ...(source.mandatory ? { mandatory: true } : {}),
                  ...(source.multiple ? { multiple: true } : {})
                })
              }
      - name: domainToApi
        instanceOf: DomainToApplication:http.DomainToApi
        source: Core:Model
        target: Application:app.Application
        outputRelation: Application:app.Application.apis
      - name: entityToResource
        instanceOf: DomainToApplication:http.EntityToResource
        source: Domain:entities.Entity
        target: Application:http.Api
        outputRelation: Application:http.Api.resources
      - name: fieldToPayloadField
        instanceOf: DomainToApplication:http.FieldToPayloadField
        source: Domain:entities.Field
        target: Application:http.Payload
        outputRelation: Application:http.Payload.fields
  - name: ui
    instanceOf: Core:Package
    elements:
      - name: EntityToPages
        instanceOf: Core:Class
        icon: mui:Article
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Application:ui.Page
            code: |
              import { Page, Field } from 'Application/ui'

              /** The input a page field is edited with (ui.Widget). */
              type Widget = 'text' | 'number' | 'checkbox' | 'date' | 'select'
                | 'textarea'

              /**
               * EntityToPages — the four pages of an entity (rules 24 to 26), in the order
               * of `pageNamesOf`: `<Entity>List`, `<Entity>Detail`, `<Entity>New` and
               * `<Entity>Edit`, on the routes of its resource.
               *
               * The list shows the single-valued fields of the entity and of its
               * ancestors. The detail and the two forms show every field, the reference
               * field of each relation and `state` when the entity has a lifecycle.
               *
               * Left to the stack pattern, which knows the resource, the path of the
               * interface and every entity: the resource of each page, the links between
               * the pages, the audit fields of the detail and the `<parent>Id` of a
               * composition child.
               */
              export default function (source) {
                const text = e('Core:String')
                const fields = this.fieldsOf(source)
                const references = this.referenceRelationsOf(source).filter((relation: any) =>
                  this.canProduce(source, this.referenceFieldName(relation))
                )
                const withState = !!source.lifecycle && this.canProduce(source, 'state')

                /** The page field of a domain field. */
                const domainField = (field: any) =>
                  new Field({
                    name: field.name,
                    type: field.type,
                    ...flagsOf(field),
                    label: this.labelOf(field.name),
                    widget: widgetOf(field)
                  })

                /** The page field of a relation: its reference field, chosen in a list. */
                const referenceField = (relation: any) => {
                  const name = this.referenceFieldName(relation)
                  return new Field({
                    name,
                    type: text,
                    ...flagsOf({ mandatory: !relation.multiple && relation.mandatory, multiple: relation.multiple }),
                    label: this.labelOf(name),
                    widget: 'select'
                  })
                }

                /** Every field of the detail and of the forms, as new specs: a spec has a single parent. */
                const everyField = () => [
                  ...fields.map(domainField),
                  ...references.map(referenceField),
                  ...(withState ? [new Field({ name: 'state', type: text, mandatory: true, label: this.labelOf('state'), widget: 'text' })] : [])
                ]

                const [listName, detailName, newName, editName] = this.pageNamesOf(source)
                const [listRoute, detailRoute, newRoute, editRoute] = this.pageRoutesOf(source)
                const page = (name: string, route: string, kind: 'list' | 'detail' | 'form', pageFields: any[]) =>
                  new Page({ name, route, title: titleOf(source.name, name), kind, fields: pageFields })
                return [
                  page(listName, listRoute, 'list', fields.filter((field: any) => !field.multiple).map(domainField)),
                  page(detailName, detailRoute, 'detail', everyField()),
                  page(newName, newRoute, 'form', everyField()),
                  page(editName, editRoute, 'form', everyField())
                ]
              }

              /**
               * The title of a page: the entity followed by the kind of page
               * (`CommandeList` gives "Commande list", rule 25).
               */
              function titleOf(entityName: string, pageName: string): string {
                return `${entityName} ${pageName.slice(entityName.length).toLowerCase()}`
              }

              /**
               * The widget of a domain field (rule 26): a multi-valued field is a
               * textarea, an enumeration a select, a primitive its own input.
               */
              function widgetOf(field: any): Widget {
                if (field.multiple) return 'textarea'
                if (field.type?.instanceOf?._inherits(e('Core:Enum'))) return 'select'
                const byType: Record<string, Widget> = { 'Core:Number': 'number', 'Core:Boolean': 'checkbox', 'Core:Date': 'date' }
                return byType[field.type?._path?.()] ?? 'text'
              }

              type Flags = { mandatory?: boolean; multiple?: boolean }

              /**
               * `mandatory` and `multiple` only when they are set: a false flag
               * stays out of the spec.
               */
              function flagsOf(flags: Flags) {
                return {
                  ...(flags.mandatory ? { mandatory: true } : {}),
                  ...(flags.multiple ? { multiple: true } : {})
                }
              }
      - name: EntityToMenuEntry
        instanceOf: Core:Class
        icon: mui:Menu
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Application:ui.MenuEntry
            code: |
              import { MenuEntry } from 'Application/ui'

              /**
               * EntityToMenuEntry — the menu entry of an entity (rule 27), named and
               * labelled after it.
               *
               * Left to the stack pattern, which knows the pages: the page it opens (the
               * list page).
               */
              export default function (source) {
                return new MenuEntry({ name: source.name, label: source.name })
              }
      - name: entityToPages
        instanceOf: DomainToApplication:ui.EntityToPages
        source: Domain:entities.Entity
        target: Application:ui.Frontend
        outputRelation: Application:ui.Frontend.pages
      - name: entityToMenuEntry
        instanceOf: DomainToApplication:ui.EntityToMenuEntry
        source: Domain:entities.Entity
        target: Application:ui.Frontend
        outputRelation: Application:ui.Frontend.menu
  - name: spa
    instanceOf: Core:Package
    elements:
      - name: FrontendLayout
        instanceOf: Core:Class
        icon: mui:ViewQuilt
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
