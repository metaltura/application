name: DomainToApplication
instanceOf: Core:Model
elements:
  - name: app
    instanceOf: Core:Package
    elements:
      - name: DomainToStack
        instanceOf: Core:Class
        abstract: true
        icon: mui:Layers
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: audit
            instanceOf: Core:PrimitiveProperty
            type: Core:Boolean
          - name: auditFields
            instanceOf: Core:FunctionProperty
            output:
              name: fields
              instanceOf: Core:OutputFeature
              multiple: true
              type: Core:String
            code: |
              /**
               * The names of the four audit fields a stack pattern adds to every record
               * and to the full payload when its option `audit` is on (rule 18).
               */
              export default function (): string[] {
                return ['createdAt', 'updatedAt', 'createdBy', 'updatedBy']
              }
      - name: DomainPattern
        instanceOf: Core:Class
        abstract: true
        icon: mui:Hub
        extends:
          - Mapping:Mapper
        properties:
          - name: entitiesOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: model
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Model
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Domain:entities.Entity
            code: |
              /**
               * Every entity of a domain model, those in packages included, in reading
               * order.
               */
              export default function (model) {
                const entityClass = e('Domain:entities.Entity')
                if (!entityClass) throw new Error('Domain:entities.Entity not found: Domain is not loaded')
                const entities: any[] = []
                const collect = (container: any): void => {
                  for (const element of container.elements ?? []) {
                    if (element.instanceOf?._inherits(entityClass)) entities.push(element)
                    else if (Array.isArray(element.elements)) collect(element)
                  }
                }
                collect(model)
                return entities
              }
          - name: lineageOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Domain:entities.Entity
            code: |
              /**
               * The entity followed by its ancestors, up to the root of `extends`.
               *
               * A loop in the inheritance chain (A extends B extends A) stops the walk at
               * the first entity seen twice, with a warning in the server log.
               */
              export default function (entity) {
                const lineage: any[] = []
                let current: any = entity
                while (current && !lineage.includes(current)) {
                  lineage.push(current)
                  current = current.extends
                }
                if (current) log.warning(`${entity.name}: inheritance loop stopped at ${current.name}`)
                return lineage
              }
          - name: fieldsOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Domain:entities.Field
            code: |
              /**
               * The fields of an entity and of its ancestors: its own first, then those of
               * its parent, and so on (rule 8).
               */
              export default function (entity) {
                return this.lineageOf(entity).flatMap((ancestor: any) => ancestor.fields ?? [])
              }
          - name: relationsOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Domain:entities.EntityRelation
            code: |
              /**
               * The relations of an entity and of its ancestors, in the order of
               * `fieldsOf`.
               */
              export default function (entity) {
                return this.lineageOf(entity).flatMap((ancestor: any) => ancestor.relations ?? [])
              }
          - name: hasReturn
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: relation
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.EntityRelation
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:Boolean
            code: |
              /**
               * Whether a relation of `entity` has a return: the entity it targets holds a
               * single-valued relation back to `entity` (rule 14). Client.commandes has a
               * return because Commande.client targets Client.
               */
              export default function (relation, entity) {
                const targetRelations: any[] = relation.type?.relations ?? []
                return targetRelations.some((back: any) => !back.multiple && back.type === entity)
              }
          - name: referenceRelationsOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Domain:entities.EntityRelation
            code: |
              /**
               * The relations that give the entity a reference field (rules 13 and 16):
               * - every single-valued relation (Commande.client gives `clientId`);
               * - every multi-valued relation that is neither a composition nor has a
               *   return (`tagsIds`).
               *
               * A multi-valued relation with a return is carried by the other entity
               * (rule 14); a composition by the child, which the stack pattern handles
               * (rule 15).
               */
              export default function (entity) {
                return this.relationsOf(entity).filter(
                  (relation: any) => !relation.multiple || (!relation.composite && !this.hasReturn(relation, entity))
                )
              }
          - name: referenceFieldName
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: relation
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.EntityRelation
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The name of the reference field of a relation: `<relation>Id` when it is
               * single-valued, `<relation>Ids` when it is multi-valued.
               */
              export default function (relation) {
                return relation.multiple ? `${relation.name}Ids` : `${relation.name}Id`
              }
          - name: canProduce
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
              - name: name
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:String
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:Boolean
            code: |
              /**
               * Whether a pattern may add a field `name` to what it produces for the
               * entity. A field of the domain with the same name (inherited ones included)
               * wins: the produced field is skipped and the server log says so.
               */
              export default function (entity, name) {
                const taken = this.fieldsOf(entity).some((field: any) => field.name === name)
                if (taken) log.warning(`${entity.name}: the domain already has a field ${name}, the produced one is skipped`)
                return !taken
              }
          - name: resourcePathOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The path of the resource of an entity: its name in lower case followed by
               * an "s" (Commande gives `/commandes`, rule 20). The plural is naive: the
               * user corrects it by hand.
               */
              export default function (entity) {
                return `/${entity.name.toLowerCase()}s`
              }
          - name: pageNamesOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Core:String
            code: |
              /**
               * The names of the four pages of an entity, in the order every interface
               * pattern follows: list, detail, new and edit (rule 24).
               */
              export default function (entity) {
                return ['List', 'Detail', 'New', 'Edit'].map((page: string) => `${entity.name}${page}`)
              }
          - name: pageRoutesOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Core:String
            code: |
              /**
               * The routes of the four pages of an entity, in the order of `pageNamesOf`:
               * they follow the path of its resource (rule 24).
               */
              export default function (entity) {
                const path = this.resourcePathOf(entity)
                return [path, `${path}/:id`, `${path}/new`, `${path}/:id/edit`]
              }
          - name: kindOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: field
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Field
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The kind of a domain field: the row it takes in the type tables of the
               * analysis (rule 12).
               * - `multiple` for a multi-valued field, whatever its type;
               * - `enum` for an enumeration of the user's model;
               * - else the name of its primitive type: `String`, `Number`, `Boolean` or
               *   `Date`.
               */
              export default function (field) {
                if (field.multiple) return 'multiple'
                const type: any = field.type
                if (type?.instanceOf?._inherits(e('Core:Enum'))) return 'enum'
                return type?.name ?? 'String'
              }
          - name: referenceNameOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: entity
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The name under which another record refers to an entity: its name with a
               * lower-case first letter (Commande gives `commande`). A composition child
               * holds `<name>Id`, LigneDeCommande.commandeId (rule 15).
               */
              export default function (entity) {
                return entity.name.charAt(0).toLowerCase() + entity.name.slice(1)
              }
          - name: labelOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: name
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:String
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The label of a field: its name split on capitals, first letter
               * capitalised (`birthDate` gives "Birth date", rule 25).
               */
              export default function (name) {
                const words = name.replace(/([A-Z])/g, ' $1').trim().toLowerCase()
                return words.charAt(0).toUpperCase() + words.slice(1)
              }
          - name: applicationNameOf
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: model
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Model
            output:
              name: name
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Core:String
            code: |
              /**
               * The name of the application a domain model gives (PLAT-1157): its own
               * name without the suffix `Domain`. The domain `BoutiqueDomain` gives the
               * application `Boutique`, and so does a domain named `Boutique`.
               */
              export default function (model) {
                const name: string = model.name
                return name.endsWith('Domain') && name.length > 'Domain'.length
                  ? name.slice(0, -'Domain'.length)
                  : name
              }
      - name: StackApplication
        instanceOf: Core:Class
        icon: mui:Apps
        extends:
          - DomainToApplication:app.DomainToStack
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Model
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Application:app.Application
            code: |
              import { Application } from 'Application/app'
              import { Field as PayloadField } from 'Application/http'
              import { Field as PageField } from 'Application/ui'
              import { Column, ForeignKey } from 'Application/sql'
              import { Field as MongoField, Reference } from 'Application/mongo'
              import { domainToApi } from 'DomainToApplication/http'
              import {
                entityToMenuEntry,
                entityToPages
              } from 'DomainToApplication/ui'
              import {
                entityToPageComponents,
                entityToRoutes,
                frontendLayout
              } from 'DomainToApplication/spa'

              /**
               * StackApplication — the Application of a stack, named after the domain
               * model (rules 10 to 29). It knows no stack: each instance, in the mapper
               * of its stack, gives it what is proper to that stack:
               * - `database` and `record`: the class of `db` and the pattern of the
               *   record of an entity — a SQL database and a table per entity, or a
               *   Mongo database and a collection per entity;
               * - `joinTables`: the pattern of the join tables of an entity, SQL only;
               * - `frontend` and `service`: the class of `web` and the pattern of the
               *   service of an entity — an Angular interface with its services, or a
               *   React one with its API clients;
               * - `frontendPackage`: the package where the head pattern of the stack
               *   puts `web`, next to the Application (`react` or `angular`);
               * - `api`: one resource per entity, the same for every stack.
               *
               * The Application designates its interface and does not contain it (Q2
               * of PLAT-1157): `web` is the first of its `frontends`, and the head
               * pattern places it in the package `frontendPackage`. `web` designates
               * the Application by its path.
               *
               * It composes the fine patterns and sets what they leave to it:
               * - the record each foreign key or reference targets;
               * - the `<parent>Id` of a composition child, in its record, its
               *   payloads and its pages (rule 15);
               * - the audit fields when `audit` is on (rule 18);
               * - the links of the interface: the resource and links of each page,
               *   the page of each menu entry, the page, payload, row link and
               *   endpoint of each component, the component of each route, the
               *   resource and endpoints of each API service.
               * - the resource of each reference field of a page, so a form can offer
               *   the elements it points to in a list (PLAT-81).
               *
               * A reference from the elements of one entity to those of another is
               * written as a path (`Boutique.db.Client`): two specs that point to
               * each other overflow the stack of the engine (PLAT-350).
               */
              export default function (source) {
                const stack: Stack = this as any
                const sql = stack.database._path() === 'Application:sql.Database'
                const entities = this.entitiesOf(source)
                const name = this.applicationNameOf(source)
                const at: Path = (...names) => [name, ...names].join('.')

                // The fine patterns, per entity
                const api: any = map(source, domainToApi)
                const resources = new Map<any, any>(
                  entities.map((entity: any, index: number) => [entity, api.resources[index]])
                )
                const records = new Map<any, any>(entities.map((entity: any) =>
                  [entity, map(entity, stack.record)]
                ))
                const joinTables = new Map<any, any[]>(entities.map((entity: any) =>
                  [entity, stack.joinTables ? mapAll(entity, stack.joinTables) : []]
                ))
                const pages = new Map<any, any[]>(
                  entities.map((entity: any) => [entity, mapAll(entity, entityToPages)])
                )
                const ui: Interface = {
                  layout: map(source, frontendLayout),
                  menu: new Map(entities.map((entity: any) => [entity, map(entity, entityToMenuEntry)])),
                  components: new Map(entities.map((entity: any) => [entity, mapAll(entity, entityToPageComponents)])),
                  routes: new Map(entities.map((entity: any) => [entity, mapAll(entity, entityToRoutes)])),
                  services: new Map(entities.map((entity: any) =>
                    [entity, map(entity, stack.service)]
                  ))
                }

                // What the fine patterns leave to the stack
                const parts: Parts = { records, resources, pages }
                linkRecords(this, entities, records, joinTables, at)
                addParentKeys(this, entities, parts, sql, at)
                if (this.audit) addAudit(this, entities, parts, sql)
                const atWeb: Path = (...names) => [stack.frontendPackage, 'web', ...names].join('.')
                linkInterface(entities, resources, pages, ui, atWeb)
                linkReferenceFields(this, entities, parts)

                const all = (byEntity: Map<any, any>) =>
                  entities.flatMap((entity: any) => byEntity.get(entity))
                return new Application({
                  name,
                  into: 'elements',
                  title: name,
                  stores: [{
                    instanceOf: stack.database._path(),
                    name: 'db',
                    records: [...all(records), ...all(joinTables)]
                  }],
                  apis: [api],
                  frontends: [{
                    instanceOf: stack.frontend._path(),
                    name: 'web',
                    application: at(),
                    pages: all(pages),
                    menu: all(ui.menu),
                    components: [ui.layout, ...all(ui.components)],
                    routes: all(ui.routes),
                    services: all(ui.services)
                  }]
                } as any)
              }

              /**
               * What the instance of a stack gives it. Its two classes become the
               * `instanceOf` of a spec: the classes of a stack are not imported here.
               */
              type Stack = {
                database: any
                record: any
                joinTables?: any
                frontend: any
                frontendPackage: string
                service: any
              }

              /**
               * A path in the user's model: `at('db', 'Client')`. Typed `any`: the
               * spec types only know elements and specs.
               */
              type Path = (...names: string[]) => any

              /** What the stack adds to, per entity. */
              type Parts = {
                records: Map<any, any>
                resources: Map<any, any>
                pages: Map<any, any[]>
              }

              /** What the interface patterns produced, per entity. */
              type Interface = {
                layout: any
                menu: Map<any, any>
                components: Map<any, any[]>
                routes: Map<any, any[]>
                services: Map<any, any>
              }

              /**
               * Each foreign key or reference targets the record of the entity its
               * relation targets (rules 13 and 16). The two foreign keys of a join
               * table target the entity and the entity its relation targets.
               */
              function linkRecords(
                pattern: any,
                entities: any[],
                records: Map<any, any>,
                joinTables: Map<any, any[]>,
                at: Path
              ) {
                for (const entity of entities) {
                  const relations = pattern.relationsOf(entity)
                  for (const relation of relations) {
                    const link = records.get(entity).references
                      .find((r: any) => r.name === relation.name)
                    if (link) link.target = at('db', relation.type.name)
                  }
                  for (const table of joinTables.get(entity) ?? []) {
                    const relation = relations
                      .find((r: any) => table.name === `${entity.name}_${r.name}`)
                    table.references[0].target = at('db', entity.name)
                    table.references[1].target = at('db', relation.type.name)
                  }
                }
              }

              /**
               * The child of a composition holds the key of its parent (rule 15):
               * LigneDeCommande gets `commandeId` in its record (with a foreign key
               * or a reference `commande`), in both payloads and in its detail and
               * form pages.
               */
              function addParentKeys(
                pattern: any,
                entities: any[],
                parts: Parts,
                sql: boolean,
                at: Path
              ) {
                const text = e('Core:String')
                for (const parent of entities) {
                  const compositions = pattern.relationsOf(parent)
                    .filter((relation: any) => relation.multiple && relation.composite)
                  for (const relation of compositions) {
                    const child = relation.type
                    const name = pattern.referenceNameOf(parent)
                    const key = `${name}Id`
                    if (!pattern.canProduce(child, key)) continue

                    const record = parts.records.get(child)
                    const target = at('db', parent.name)
                    if (sql) {
                      const column = new Column({ name: key, type: text, mandatory: true, sqlType: 'CHAR(36)' })
                      record.fields.push(column)
                      record.references.push(new ForeignKey({ name, column, target }))
                    } else {
                      const field = new MongoField({ name: key, type: text, mandatory: true, bsonType: 'string' })
                      record.fields.push(field)
                      record.references.push(new Reference({ name, field, target }))
                    }
                    for (const payload of parts.resources.get(child).payloads) {
                      payload.fields.push(new PayloadField({ name: key, type: text, mandatory: true }))
                    }
                    const [, ...detailAndForms] = parts.pages.get(child) ?? []
                    for (const page of detailAndForms) {
                      page.fields.push(new PageField({
                        name: key, type: text, mandatory: true, label: pattern.labelOf(key), widget: 'select',
                        resource: parts.resources.get(parent)
                      }))
                    }
                  }
                }
              }

              /**
               * The four audit fields (rule 18), on every record, on the full payload
               * and on the detail page. `createdAt` and `updatedAt` are dates,
               * `createdBy` and `updatedBy` texts of 100 characters in SQL.
               */
              function addAudit(
                pattern: any,
                entities: any[],
                parts: Parts,
                sql: boolean
              ) {
                for (const entity of entities) {
                  for (const name of pattern.auditFields()) {
                    if (!pattern.canProduce(entity, name)) continue
                    const date = name.endsWith('At')
                    const type = e(date ? 'Core:Date' : 'Core:String')
                    parts.records.get(entity).fields.push(sql
                      ? new Column({ name, type, sqlType: date ? 'TIMESTAMP' : 'VARCHAR(100)' })
                      : new MongoField({ name, type, bsonType: date ? 'date' : 'string' }))
                    const [full] = parts.resources.get(entity).payloads
                    full.fields.push(new PayloadField({ name, type }))
                    const [, detail] = parts.pages.get(entity) ?? []
                    detail?.fields.push(new PageField({
                      name, type, label: pattern.labelOf(name), widget: date ? 'date' : 'text'
                    }))
                  }
                }
              }

              /**
               * The links of the interface (rules 24 to 29), per entity: the pages
               * show the resource and link to one another, the menu entry opens the
               * list, each component shows its page with its payload, row link or
               * endpoint, each route opens its component, the service serves the
               * five endpoints of the resource.
               *
               * The links between pages go forward as specs (list to detail and new,
               * detail to edit) and back as paths (PLAT-350): `atWeb` writes the path
               * of a page from the target of the Mapping, `react.web.ClientList`.
               */
              function linkInterface(
                entities: any[],
                resources: Map<any, any>,
                pages: Map<any, any[]>,
                ui: Interface,
                atWeb: Path
              ) {
                for (const entity of entities) {
                  const resource = resources.get(entity)
                  const [full, input] = resource.payloads
                  const endpoint = (name: string) =>
                    resource.endpoints.find((x: any) => x.name === name)
                  const entityPages = pages.get(entity) ?? []
                  const [list, detail, create, edit] = entityPages
                  const back = (page: any) => atWeb(page.name)

                  for (const page of entityPages) page.resource = resource
                  list.links = [detail, create]
                  detail.links = [edit, back(list)]
                  create.links = [back(list)]
                  edit.links = [back(detail), back(list)]

                  ui.menu.get(entity).page = list

                  const components = ui.components.get(entity) ?? []
                  components.forEach((component: any, index: number) => {
                    component.page = entityPages[index]
                  })
                  const [table, sheet, newForm, editForm] =
                    components.map((component: any) => component.children[0])
                  Object.assign(table, { payload: full, rowLink: detail })
                  Object.assign(sheet, { payload: full })
                  Object.assign(newForm, { payload: input, endpoint: endpoint('create') })
                  Object.assign(editForm, { payload: input, endpoint: endpoint('update') })

                  ui.routes.get(entity)?.forEach((route: any, index: number) => {
                    route.component = components[index]
                  })
                  Object.assign(ui.services.get(entity), {
                    resource,
                    endpoints: [...resource.endpoints]
                  })
                }
              }

              /**
               * Each reference field of a page names the resource its values come
               * from: `clientId` of Commande names the resource Client, so a form
               * offers the clients in a list (PLAT-81). The entity the relation
               * targets gives the resource; a target outside the model leaves the
               * field as it is.
               */
              function linkReferenceFields(
                pattern: any,
                entities: any[],
                parts: Parts
              ) {
                for (const entity of entities) {
                  for (const relation of pattern.referenceRelationsOf(entity)) {
                    const name = pattern.referenceFieldName(relation)
                    const target = entities.find((x: any) => x === relation.type)
                      ?? entities.find((x: any) => x.name === relation.type?.name)
                    const resource = target && parts.resources.get(target)
                    if (!resource) continue
                    for (const page of parts.pages.get(entity) ?? []) {
                      const field = page.fields.find((f: any) => f.name === name)
                      if (field) field.resource = resource
                    }
                  }
                }
              }
