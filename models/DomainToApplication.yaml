              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Core:Model
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              type: Application:spa.Layout
            code: |
              import { Layout, Navbar } from 'Application/spa'

              /**
               * FrontendLayout — the frame of an interface (rule 28): the layout `layout`
               * with its navigation bar `navbar`, titled with the name of the application
               * the domain model gives (`applicationNameOf`).
               */
              export default function (source) {
                return new Layout({
                  name: 'layout',
                  children: [new Navbar({ name: 'navbar', title: this.applicationNameOf(source), color: '#37474f' })]
                })
              }
      - name: EntityToPageComponents
        instanceOf: Core:Class
        icon: mui:Widgets
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Application:spa.PageComponent
            code: |
              import {
                Detail,
                Form,
                PageComponent,
                Table
              } from 'Application/spa'

              /**
               * EntityToPageComponents — the four page components of an entity (rule 28),
               * in the order of `pageNamesOf`, each named after its page followed by "Page":
               * - `<Entity>ListPage` holds the table `<Entity>Table`;
               * - `<Entity>DetailPage` holds the detail `<Entity>Detail`;
               * - `<Entity>NewPage` and `<Entity>EditPage` each hold the form `<Entity>Form`.
               *
               * Left to the stack pattern, which knows the pages and the resource: the page
               * of each component, the payload of each child, the row link of the table and
               * the endpoint of each form.
               */
              export default function (source) {
                const [listName, detailName, newName, editName] = this.pageNamesOf(source)
                const component = (pageName: string, child: any) => new PageComponent({ name: `${pageName}Page`, children: [child] })
                return [
                  component(listName, new Table({ name: `${source.name}Table` })),
                  component(detailName, new Detail({ name: `${source.name}Detail` })),
                  component(newName, new Form({ name: `${source.name}Form` })),
                  component(editName, new Form({ name: `${source.name}Form` }))
                ]
              }
      - name: EntityToRoutes
        instanceOf: Core:Class
        icon: mui:AltRoute
        extends:
          - DomainToApplication:app.DomainPattern
        properties:
          - name: map
            instanceOf: Core:FunctionProperty
            mandatory: true
            input:
              - name: source
                instanceOf: Core:InputFeature
                mandatory: true
                type: Domain:entities.Entity
            output:
              name: output
              instanceOf: Core:OutputFeature
              mandatory: true
              multiple: true
              type: Application:spa.Route
            code: |
              import { Route } from 'Application/spa'

              /**
               * EntityToRoutes — the four routes of an entity (rule 29), in the order of
               * `pageNamesOf`, each named after its page followed by "Route", on the route
               * of that page. None is lazy.
               *
               * Left to the stack pattern, which knows the page components: the component
               * of each route.
               */
              export default function (source) {
                const routes = this.pageRoutesOf(source)
                return this.pageNamesOf(source).map(
                  (pageName: string, index: number) => new Route({ name: `${pageName}Route`, path: routes[index], lazy: false })
                )
              }
      - name: frontendLayout
        instanceOf: DomainToApplication:spa.FrontendLayout
        source: Core:Model
        target: Application:spa.Frontend
        outputRelation: Application:spa.Frontend.components
      - name: entityToPageComponents
        instanceOf: DomainToApplication:spa.EntityToPageComponents
        source: Domain:entities.Entity
        target: Application:spa.Frontend
        outputRelation: Application:spa.Frontend.components
      - name: entityToRoutes
        instanceOf: DomainToApplication:spa.EntityToRoutes
        source: Domain:entities.Entity
        target: Application:spa.Frontend
        outputRelation: Application:spa.Frontend.routes
