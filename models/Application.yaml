  - name: bpmn
    instanceOf: Core:Package
    elements:
      - name: Process
        instanceOf: Core:Class
        icon: mui:AccountTree
        extends:
          - Core:RootElement
        properties:
          - name: flowElements
            instanceOf: Core:Relation
            multiple: true
            to: Application:bpmn.FlowElement
            composite: true
          - name: lanes
            instanceOf: Core:Relation
            multiple: true
            to: Application:bpmn.Lane
            composite: true
      - name: FlowElement
        instanceOf: Core:Class
        abstract: true
        extends:
          - Core:Element
      - name: FlowNode
        instanceOf: Core:Class
        abstract: true
        extends:
          - Application:bpmn.FlowElement
      - name: Task
        instanceOf: Core:Class
        icon: mui:CropSquare
        extends:
          - Application:bpmn.FlowNode
      - name: StartEvent
        instanceOf: Core:Class
        icon: mui:RadioButtonUnchecked
        extends:
          - Application:bpmn.FlowNode
      - name: EndEvent
        instanceOf: Core:Class
        icon: mui:Lens
        extends:
          - Application:bpmn.FlowNode
      - name: ExclusiveGateway
        instanceOf: Core:Class
        icon: mui:ChangeHistory
        extends:
          - Application:bpmn.FlowNode
      - name: SequenceFlow
        instanceOf: Core:Class
        icon: mui:ArrowRightAlt
        extends:
          - Application:bpmn.FlowElement
        properties:
          - name: sourceRef
            instanceOf: Core:Relation
            mandatory: true
            to: Application:bpmn.FlowNode
          - name: targetRef
            instanceOf: Core:Relation
            mandatory: true
            to: Application:bpmn.FlowNode
          - name: label
            instanceOf: Core:PrimitiveProperty
            type: Core:String
        validations:
          - name: flowFromEndEvent
            instanceOf: Core:Validation
            execute: |
              export default function(element: any) {
                // BPMN: A sequence flow cannot start from an end event
                const end = element.sourceRef
                if (!end || !end.instanceOf || end.instanceOf._path() !== 'Application:bpmn.EndEvent') return []
                return [{ element, propertyName: 'sourceRef', message: 'A sequence flow cannot start from an end event' }]
              }
          - name: flowToStartEvent
            instanceOf: Core:Validation
            execute: |
              export default function(element: any) {
                // BPMN: A sequence flow cannot end on a start event
                const end = element.targetRef
                if (!end || !end.instanceOf || end.instanceOf._path() !== 'Application:bpmn.StartEvent') return []
                return [{ element, propertyName: 'targetRef', message: 'A sequence flow cannot end on a start event' }]
              }
      - name: Lane
        instanceOf: Core:Class
        icon: mui:ViewStream
        extends:
          - Core:Element
        properties:
          - name: flowNodeRefs
            instanceOf: Core:Relation
            multiple: true
            to: Application:bpmn.FlowNode
      - name: task
        instanceOf: Diagram:notation.NodeShape
        outline: roundedRectangle
        cornerRadius: 10
        fill: '#1565c0'
        strokeWidth: 1
        width: 120
        height: 80
        padding: 8
        parts:
          - name: title
            instanceOf: Diagram:notation.TextPart
            position: center
      - name: startEvent
        instanceOf: Diagram:notation.NodeShape
        outline: ellipse
        fill: '#2e7d32'
        strokeWidth: 1
        width: 36
        height: 36
        fixedAspect: true
        parts:
          - name: title
            instanceOf: Diagram:notation.TextPart
            position: below
      - name: endEvent
        instanceOf: Diagram:notation.NodeShape
        outline: ellipse
        fill: '#c62828'
        strokeWidth: 3
        width: 36
        height: 36
        fixedAspect: true
        parts:
          - name: title
            instanceOf: Diagram:notation.TextPart
            position: below
      - name: gateway
        instanceOf: Diagram:notation.NodeShape
        outline: rhombus
        fill: '#f9a825'
        strokeWidth: 1
        width: 50
        height: 50
        fixedAspect: true
        parts:
          - name: title
            instanceOf: Diagram:notation.TextPart
            position: below
      - name: lane
        instanceOf: Diagram:notation.NodeShape
        outline: rectangle
        fill: '#546e7a'
        strokeWidth: 1
        width: 600
        height: 160
        headerHeight: 30
        padding: 10
        parts:
          - name: title
            instanceOf: Diagram:notation.TextPart
            position: left
          - name: content
            instanceOf: Diagram:notation.RegionPart
      - name: sequenceFlow
        instanceOf: Diagram:notation.LinkShape
        router: segment
        rounded: true
        strokeWidth: 1
        targetEnd:
          name: flowEnd
          instanceOf: Diagram:notation.Marker
          preset: arrow
          filled: true
        labels:
          - name: label
            instanceOf: Diagram:notation.LinkLabel
            position: middle
            x: 0
            'y': -10
      - name: BpmnDiagram
        instanceOf: Diagram:types.DiagramType
        icon: mui:AccountTree
        subject: Application:bpmn.Process
        nodes:
          - name: task
            instanceOf: Diagram:types.NodeMapping
            represents: Application:bpmn.Task
            shape: Application:bpmn.task
            createIn: Application:bpmn.Process.flowElements
            bindings:
              - name: title
                instanceOf: Diagram:types.Binding
                slot: title
                text: '{name}'
          - name: startEvent
            instanceOf: Diagram:types.NodeMapping
            represents: Application:bpmn.StartEvent
            shape: Application:bpmn.startEvent
            createIn: Application:bpmn.Process.flowElements
            bindings:
              - name: title
                instanceOf: Diagram:types.Binding
                slot: title
                text: '{name}'
          - name: endEvent
            instanceOf: Diagram:types.NodeMapping
            represents: Application:bpmn.EndEvent
            shape: Application:bpmn.endEvent
            createIn: Application:bpmn.Process.flowElements
            bindings:
              - name: title
                instanceOf: Diagram:types.Binding
                slot: title
                text: '{name}'
          - name: exclusiveGateway
            instanceOf: Diagram:types.NodeMapping
            represents: Application:bpmn.ExclusiveGateway
            shape: Application:bpmn.gateway
            createIn: Application:bpmn.Process.flowElements
            bindings:
              - name: title
                instanceOf: Diagram:types.Binding
                slot: title
                text: '{name}'
          - name: lane
            instanceOf: Diagram:types.NodeMapping
            represents: Application:bpmn.Lane
            shape: Application:bpmn.lane
            createIn: Application:bpmn.Process.lanes
            bindings:
              - name: title
                instanceOf: Diagram:types.Binding
                slot: title
                text: '{name}'
              - name: content
                instanceOf: Diagram:types.Binding
                slot: content
                relation: Application:bpmn.Lane.flowNodeRefs
        links:
          - name: flow
            instanceOf: Diagram:types.ElementLink
            shape: Application:bpmn.sequenceFlow
            bindings:
              - name: label
                instanceOf: Diagram:types.Binding
                slot: label
                text: '{label}'
            represents: Application:bpmn.SequenceFlow
            from: Application:bpmn.SequenceFlow.sourceRef
            to: Application:bpmn.SequenceFlow.targetRef
            createIn: Application:bpmn.Process.flowElements
            ask:
              - Application:bpmn.SequenceFlow.label
  - name: packaging
    instanceOf: Core:Package
    elements:
      - name: ApplicationElement
        instanceOf: Core:Class
        color: '#3dbe0e'
        extends:
          - Core:RootElement
      - name: ApplicationPackage
        instanceOf: Core:Class
        extends:
          - Application:packaging.ApplicationElement
          - Core:Package
      - name: ApplicationRootElement
        instanceOf: Core:Class
        abstract: true
        extends:
          - Application:packaging.ApplicationElement
          - Core:RootElement
version: latest
depends:
  - Diagram
  - Uml
