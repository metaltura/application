          - Application:spa.Component
        properties:
          - name: page
            instanceOf: Core:Relation
            mandatory: true
            to: Application:ui.Page
            filter: |
              export default function run(page: any, owner: any): boolean {
                const frontendOf = (c: any): any => {
                  let x = c
                  for (let i = 0; x && i < 20; i++) {
                    if (x.frontend) return x.frontend
                    x = x.parent
                  }
                  return undefined
                }
                const frontend = frontendOf(owner)
                return !!page && !!frontend && page.frontend === frontend
