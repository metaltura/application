            to: Application:spa.ApiService
            composite: true
            opposite: Application:spa.ApiService.frontend
        validations:
          - name: topLevelComponents
            instanceOf: Core:Validation
            execute: |
              export default function(element: any) {
                const ws = element._workspace
                if (!ws) return []
                const pageComponent = ws._get('Application:spa.PageComponent')
                const layout = ws._get('Application:spa.Layout')
                if (!pageComponent || !layout) return []
                const components = element.components || []
                const layouts = components.filter((c: any) => c.instanceOf._inherits(layout))
                const others = components.filter((c: any) => !c.instanceOf._inherits(layout) && !c.instanceOf._inherits(pageComponent))
                if (layouts.length <= 1 && others.length === 0) return []
                return [{ element, message: 'topLevelComponents', propertyName: 'components' }]
              }
      - name: Component
        instanceOf: Core:Class
        abstract: true
        icon: mui:Widgets
        extends:
