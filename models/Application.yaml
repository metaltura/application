  - name: sql
    instanceOf: Core:Package
    elements:
      - name: Database
        instanceOf: Core:Class
        icon: mui:Storage
        color: '#0277bd'
        extends:
          - Application:data.Store
        validations:
          - name: tablesOnly
            instanceOf: Core:Validation
            execute: |
              export default function(element: any) {
                const table = element._workspace && element._workspace._get('Application:sql.Table')
                const records = element.records || []
                if (!table || records.every((r: any) => r.instanceOf._inherits(table))) return []
                return [{ element, message: 'tablesOnly', propertyName: 'records' }]
              }
      - name: Table
        instanceOf: Core:Class
        icon: mui:TableChart
        extends:
          - Application:data.Record
        validations:
          - name: sqlChildren
            instanceOf: Core:Validation
            execute: |
              export default function(element: any) {
                const ws = element._workspace
                if (!ws) return []
                const column = ws._get('Application:sql.Column')
                const foreignKey = ws._get('Application:sql.ForeignKey')
                const errors: any[] = []
                if (column && !(element.fields || []).every((f: any) => f.instanceOf._inherits(column))) {
                  errors.push({ element, message: 'columnsOnly', propertyName: 'fields' })
                }
                if (foreignKey && !(element.references || []).every((r: any) => r.instanceOf._inherits(foreignKey))) {
                  errors.push({ element, message: 'foreignKeysOnly', propertyName: 'references' })
                }
                return errors
              }
      - name: Column
        instanceOf: Core:Class
        icon: mui:ViewColumn
        extends:
          - Application:data.StoredField
        properties:
          - name: sqlType
            instanceOf: Core:PrimitiveProperty
            mandatory: true
            type: Core:String
          - name: defaultValue
            instanceOf: Core:PrimitiveProperty
            type: Core:String
      - name: ForeignKey
        instanceOf: Core:Class
        icon: mui:Link
        extends:
          - Application:data.Reference
        properties:
          - name: column
            instanceOf: Core:Relation
            mandatory: true
            to: Application:sql.Column
            filter: |
              export default function run(column: any, owner: any): boolean {
                return !!column && !!owner && !!owner.record && column.record === owner.record
              }
      - name: tableBox
        instanceOf: Diagram:notation.NodeShape
        outline: rectangle
        fill: '#0277bd'
        strokeWidth: 1
        width: 220
        height: 60
        headerHeight: 26
        padding: 10
        parts:
          - name: icon
            instanceOf: Diagram:notation.IconPart
            anchor: titleLeft
          - name: title
            instanceOf: Diagram:notation.TextPart
            position: top
            band: true
          - name: rows
            instanceOf: Diagram:notation.ListPart
      - name: foreignKey
        instanceOf: Diagram:notation.LinkShape
        router: segment
        rounded: true
        stroke: '#0277bd'
        strokeWidth: 2
        sourceEnd:
          name: manyEnd
          instanceOf: Diagram:notation.Marker
          preset: zeroOrMany
        targetEnd:
          name: optionalEnd
          instanceOf: Diagram:notation.Marker
          preset: zeroOrOne
        labels:
          - name: label
            instanceOf: Diagram:notation.LinkLabel
            position: middle
      - name: mandatoryForeignKey
        instanceOf: Diagram:notation.LinkShape
        router: segment
        rounded: true
        stroke: '#0277bd'
        strokeWidth: 2
        sourceEnd:
          name: manyEnd
          instanceOf: Diagram:notation.Marker
          preset: zeroOrMany
        targetEnd:
          name: oneEnd
          instanceOf: Diagram:notation.Marker
          preset: one
        labels:
          - name: label
            instanceOf: Diagram:notation.LinkLabel
            position: middle
      - name: databaseLayout
        instanceOf: Diagram:notation.LayoutSettings
        algorithm: layered
        direction: up
      - name: DatabaseDiagram
        instanceOf: Diagram:types.DiagramType
        icon: mui:TableChart
        layoutSettings: Application:sql.databaseLayout
        subject: Application:sql.Database
        nodes:
          - name: table
            instanceOf: Diagram:types.NodeMapping
            represents: Application:sql.Table
            shape: Application:sql.tableBox
            createIn: Application:data.Store.records
            bindings:
              - name: title
                instanceOf: Diagram:types.Binding
                slot: title
                text: '{name}'
              - name: icon
                instanceOf: Diagram:types.Binding
                slot: icon
                icon: mui:TableChart
              - name: rows
                instanceOf: Diagram:types.Binding
                slot: rows
                relation: Application:data.Record.fields
                rows:
                  - name: column
                    instanceOf: Diagram:types.RowBinding
                    represents: Application:sql.Column
                    text: '{name}: {sqlType}'
        links:
          - name: foreignKey
            instanceOf: Diagram:types.ElementLink
            shape: Application:sql.foreignKey
            bindings:
              - name: label
                instanceOf: Diagram:types.Binding
                slot: label
                text: '{name}'
            variants:
              - name: mandatory
                instanceOf: Diagram:types.Variant
                when: column.mandatory
                linkShape: Application:sql.mandatoryForeignKey
            represents: Application:sql.ForeignKey
            from: Application:data.Reference.record
            to: Application:data.Reference.target
      - name: SqlDiagram
        instanceOf: Diagram:core.Diagram
        type: Uml:ClassDiagram
        subject: Application:sql
        nodes:
          - name: DataStore
            instanceOf: Diagram:core.Node
            element: Application:data.Store
            x: -535
            'y': 40
            width: 200
            height: 72
          - name: DataRecord
            instanceOf: Diagram:core.Node
            element: Application:data.Record
            x: -245
            'y': 40
            width: 200
            height: 120
          - name: DataStoredField
            instanceOf: Diagram:core.Node
            element: Application:data.StoredField
            x: 45
            'y': 40
            width: 200
            height: 60
          - name: DataReference
            instanceOf: Diagram:core.Node
            element: Application:data.Reference
            x: 335
            'y': 40
            width: 200
            height: 72
          - name: SqlDatabase
            instanceOf: Diagram:core.Node
            element: Application:sql.Database
            x: -535
            'y': 270
            width: 200
            height: 60
          - name: SqlTable
            instanceOf: Diagram:core.Node
            element: Application:sql.Table
            x: -245
            'y': 270
            width: 200
            height: 60
          - name: SqlColumn
            instanceOf: Diagram:core.Node
            element: Application:sql.Column
            x: 45
            'y': 270
            width: 200
            height: 72
          - name: SqlForeignKey
            instanceOf: Diagram:core.Node
            element: Application:sql.ForeignKey
            x: 335
            'y': 270
            width: 200
            height: 60
        links:
          - name: SqlForeignKeyColumnLink
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:sql.ForeignKey.column
            labelX: 0.7
            labelY: -10
          - name: recordsLink
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:data.Store.records
            hidden: true
          - name: storeLink
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:data.Record.store
            hidden: true
          - name: fieldsLink
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:data.Record.fields
            hidden: true
          - name: referencesLink
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:data.Record.references
            hidden: true
          - name: keyLink
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:data.Record.key
            hidden: true
          - name: recordLink
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:data.StoredField.record
            hidden: true
          - name: recordLink2
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:data.Reference.record
            hidden: true
          - name: targetLink
            instanceOf: Diagram:core.Link
            mapping: Uml:ClassDiagram.relation
            element: Application:data.Reference.target
            hidden: true
