  - name: data
    instanceOf: Core:Package
    elements:
      - name: Store
        instanceOf: Core:Class
        abstract: true
        icon: mui:Storage
        extends:
          - Core:Element
        properties:
          - name: application
            instanceOf: Core:Relation
            mandatory: true
            to: Application:app.Application
            opposite: Application:app.Application.stores
          - name: records
            instanceOf: Core:Relation
            multiple: true
            to: Application:data.Record
            composite: true
            opposite: Application:data.Record.store
      - name: Record
        instanceOf: Core:Class
        abstract: true
        icon: mui:TableChart
        extends:
          - Core:Element
        properties:
          - name: store
            instanceOf: Core:Relation
            mandatory: true
            to: Application:data.Store
            opposite: Application:data.Store.records
          - name: fields
            instanceOf: Core:Relation
            multiple: true
            to: Application:data.StoredField
            composite: true
            opposite: Application:data.StoredField.record
          - name: references
            instanceOf: Core:Relation
            multiple: true
            to: Application:data.Reference
            composite: true
            opposite: Application:data.Reference.record
          - name: indexes
            instanceOf: Core:Relation
            multiple: true
            to: Application:data.Index
            composite: true
            opposite: Application:data.Index.record
          - name: key
            instanceOf: Core:Relation
            to: Application:data.StoredField
            filter: |
              export default function run(field: any, owner: any): boolean {
                return !!field && !!owner && field.record === owner
              }
      - name: StoredField
        instanceOf: Core:Class
        abstract: true
        extends:
          - Application:app.Field
        properties:
          - name: record
            instanceOf: Core:Relation
            mandatory: true
            to: Application:data.Record
            opposite: Application:data.Record.fields
      - name: Reference
        instanceOf: Core:Class
        abstract: true
        icon: mui:Link
        extends:
          - Core:Element
        properties:
          - name: record
            instanceOf: Core:Relation
            mandatory: true
            to: Application:data.Record
            opposite: Application:data.Record.references
          - name: target
            instanceOf: Core:Relation
            mandatory: true
            to: Application:data.Record
            filter: |
              export default function run(target: any, owner: any): boolean {
                return !!target && !!owner && !!owner.record && target.store === owner.record.store
              }
      - name: Index
        instanceOf: Core:Class
        icon: mui:Sort
        extends:
          - Core:Element
        properties:
          - name: record
            instanceOf: Core:Relation
            mandatory: true
            to: Application:data.Record
            opposite: Application:data.Record.indexes
          - name: fields
            instanceOf: Core:Relation
            mandatory: true
            multiple: true
            to: Application:data.StoredField
            filter: |
              export default function run(field: any, owner: any): boolean {
                return !!field && !!owner && !!owner.record && field.record === owner.record
              }
          - name: unique
            instanceOf: Core:PrimitiveProperty
            type: Core:Boolean
